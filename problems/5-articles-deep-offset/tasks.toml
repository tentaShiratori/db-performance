[problem5-init]
description = "Create the problem database and load schema/data"
run = """
#!/usr/bin/env bash
set -euo pipefail
if ! docker compose exec -T db psql -U postgres -d postgres -Atc "SELECT 1 FROM pg_database WHERE datname = '5-articles-deep-offset'" | grep -q 1; then
  docker compose exec -T db psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE "5-articles-deep-offset"'
fi
docker compose exec -T db psql -U postgres -d "5-articles-deep-offset" -v ON_ERROR_STOP=1 < problems/5-articles-deep-offset/init/01_schema_and_data.sql
"""

[problem5-run]
description = "Run the slow query against the problem database"
run = """
docker compose exec -T db psql -U postgres -d "5-articles-deep-offset" -v ON_ERROR_STOP=1 < problems/5-articles-deep-offset/slow_query.sql
"""
